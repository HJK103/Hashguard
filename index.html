<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HashGuard - Malware & Integrity Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }
        body {
            background-color: #f4f4f0;
            color: #111;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 24px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-transform: uppercase;
            border-bottom: 3px solid #000;
            padding-bottom: 8px;
        }
        p.subtitle {
            font-size: 13px;
            margin-bottom: 20px;
            background: #ffde59;
            display: inline-block;
            padding: 2px 6px;
            border: 2px solid #000;
            font-weight: bold;
        }
        .upload-box {
            border: 3px dashed #000;
            padding: 30px;
            text-align: center;
            background: #f9f9f9;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .upload-box:hover {
            background: #eee;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #000;
            color: #fff;
            border: 3px solid #000;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px #ffde59;
            width: 100%;
            text-transform: uppercase;
            font-size: 14px;
        }
        .btn:active {
            box-shadow: 1px 1px 0px #ffde59;
            transform: translate(2px, 2px);
        }
        .result-box {
            margin-top: 20px;
            border: 3px solid #000;
            background: #111;
            color: #0f0;
            padding: 16px;
            display: none;
            word-break: break-all;
        }
        .result-box h3 {
            color: #ffde59;
            margin-bottom: 10px;
            border-bottom: 1px dashed #555;
            padding-bottom: 5px;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HashGuard // v1.0</h1>
        <p class="subtitle">Local Integrity & Threat Analyzer</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p id="fileLabel"><b>[+] TAP TO SELECT FILE TO SCAN</b></p>
            <input type="file" id="fileInput" onchange="handleFileSelect(this)">
        </div>

        <button class="btn" onclick="uploadFile()">Run Security Scan</button>

        <div class="result-box" id="resultBox">
            <h3>[ Scan Report ]</h3>
            <div class="result-item" id="resName">Filename: -</div>
            <div class="result-item" id="resMd5">MD5: -</div>
            <div class="result-item" id="resSha">SHA-256: -</div>
            <div class="result-item" id="resStatus" style="color: #0ff; font-weight: bold;">Status: -</div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect(input) {
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('fileLabel').innerHTML = `<b>Selected:</b> ${selectedFile.name}`;
            }
        }

        function uploadFile() {
            if (!selectedFile) {
                alert("Please select a file first!");
                return;
            }

            let formData = new FormData();
            formData.append("file", selectedFile);

            document.getElementById('resStatus').innerText = "Status: Scanning file hashes & signatures...";
            document.getElementById('resultBox').style.display = 'block';

            fetch('/scan', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('resName').innerText = `Filename: ${data.filename}`;
                document.getElementById('resMd5').innerText = `MD5: ${data.md5}`;
                document.getElementById('resSha').innerText = `SHA-256: ${data.sha256}`;
                document.getElementById('resStatus').innerText = `Status: ${data.scan.status} (${data.scan.engine_matches})`;
            })
            .catch(error => {
                alert("Error scanning file!");
                console.error(error);
            });
        }
    </script>
</body>
</html>
